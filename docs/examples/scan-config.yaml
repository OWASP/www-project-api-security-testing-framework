# OWASP API Security Testing Framework: example configuration
# Pass this file to the CLI with: java -jar astf-v2.0.2.jar -c scan-config.yaml
#
# Every key is optional except targetUrl (or pass -u on the command line).
# Command-line flags override what is written here.
#
# Bearer tokens, API keys and client certificates are NOT read from this file
# (HTTP Basic and proxy credentials can be, below). Pass them on the command line,
# ideally from environment variables so they stay out of shell history:
#   --token "$API_TOKEN"            Bearer token
#   --secondary-token "$TOKEN_B"    second identity, enables cross-user BOLA checks
#   --api-key "$KEY" --api-key-header X-API-Key
#   --username u --password p       HTTP Basic (or use basicAuth below)
#
# Only scan systems you are authorized to test. Some checks send bursts of
# requests and state-changing calls, so use a staging environment.

# Base URL of the API under test.
targetUrl: "https://api.example.com"

# Automatic endpoint discovery (OpenAPI/Swagger probing, common paths).
# Skipped automatically when `endpoints` or `endpointsFile` is given.
discoveryEnabled: true

# Concurrency and time limit.
threads: 10
timeoutMinutes: 30

# Output: JSON, HTML, SARIF or XML.
outputFormat: "JSON"
outputFile: "astf-results.json"
verbose: false

# Extra request headers sent with every request.
headers:
  Accept: "application/json"
  # X-Custom-Header: "value"

# HTTP Basic credentials (alternative to --username / --password).
# basicAuth:
#   username: "admin"
#   password: "change-me"

# Outbound proxy.
# proxy:
#   host: "127.0.0.1"
#   port: 8080
#   username: "proxyuser"      # only if the proxy requires auth
#   password: "proxypass"

# Test case selection by ID (leave both out to run everything).
# enableTestCases:
#   - "ASTF-API1-2023"
# disableTestCases:
#   - "ASTF-API10-2023"

# Manual endpoints. Use ONE of `endpoints` (inline) or `endpointsFile`;
# if both are set, the inline list wins.
#
# endpoints:
#   - path: "/api/v1/users"
#     method: "GET"
#   - path: "/api/v1/users"
#     method: "POST"
#     # Optional sample body: a string is sent as-is, a mapping is serialized to
#     # JSON. Injection checks use these real field names instead of guessing.
#     requestBody:
#       username: "alice"
#       email: "alice@example.com"
#   - path: "/api/v1/users/{id}"
#     method: "DELETE"
#
# endpointsFile: "/path/to/endpoints.txt"   # one "METHOD /path" per line
