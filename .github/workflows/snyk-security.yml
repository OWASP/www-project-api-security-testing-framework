name: Snyk Security

# Scans the Maven dependencies and the source with Snyk. It needs a SNYK_TOKEN repository secret
# (Settings > Secrets and variables > Actions). Pull requests from forks never receive repository
# secrets, so the scan is skipped for them and runs once the change is on a branch of this repository.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    # A fork pull request cannot read SNYK_TOKEN, so the job would only fail with 401. Show it as skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Require SNYK_TOKEN
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The project needs Java 21 to resolve its Maven dependencies, as in ci.yml.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Snyk CLI to check for security issues
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      # Fails the check for high and critical issues only; lower severities are still reported by Snyk.
      - name: Snyk Open Source test (Maven dependencies)
        run: snyk test --severity-threshold=high

      - name: Snyk Code test
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Upload result to GitHub Code Scanning
        if: ${{ always() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

      # Keeps the dependency snapshot in Snyk up to date so new advisories raise alerts after merge.
      - name: Snyk Open Source monitor
        if: github.event_name == 'push'
        run: snyk monitor
